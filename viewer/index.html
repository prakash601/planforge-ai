<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PlanForge AI | Calibration</title>
  </head>
  <body>
    <header>
      <div class="identity">
        <strong>PlanForge AI</strong><span id="stage">Calibration</span>
      </div>
      <div class="actions">
        <span id="scale-status">Scale unverified</span>
        <button id="fit" title="Fit scene" aria-label="Fit scene">
          <i data-lucide="maximize"></i>
        </button>
        <button
          id="rotate"
          title="Auto rotate"
          aria-label="Auto rotate"
          aria-pressed="false"
        >
          <i data-lucide="rotate-3d"></i>
        </button>
        <a
          id="download"
          title="Download point cloud"
          aria-label="Download point cloud"
          download
          ><i data-lucide="download"></i
        ></a>
      </div>
    </header>
    <main>
      <aside>
        <label for="capture">Capture</label
        ><select id="capture" disabled></select>
        <div id="cloud-layer" hidden>
          <label for="layer">Cloud</label>
          <select id="layer">
            <option value="filtered">Filtered voxels</option>
            <option value="raw">Raw observations</option>
          </select>
        </div>
        <div class="section">
          <label id="frame-heading">Frames</label>
          <div id="frame-modes" class="segmented">
            <button id="all" aria-pressed="true">Sequence</button
            ><button id="single" aria-pressed="false">Single frame</button>
          </div>
          <input
            id="frame"
            type="range"
            min="0"
            max="0"
            value="0"
            aria-label="Selected frame"
          />
          <div class="row">
            <span id="frame-label">---</span><span id="frame-count">---</span>
          </div>
        </div>
        <div class="section">
          <label for="confidence">Confidence labels</label>
          <select id="confidence">
            <option value="0">All: 0, 1, 2</option>
            <option value="1">Labels 1 and 2</option>
            <option value="2" selected>Label 2 only</option>
          </select>
          <label class="check"
            ><input type="checkbox" id="trajectory" checked />Trajectory</label
          >
          <label for="point-size">Point size</label
          ><input
            id="point-size"
            type="range"
            min="1"
            max="6"
            step="0.5"
            value="2"
          />
        </div>
        <div id="geometry-controls" class="section" hidden>
          <h2>Candidate geometry</h2>
          <label class="check"
            ><input type="checkbox" id="planes" checked />Plane envelopes</label
          >
          <label class="check"
            ><input type="checkbox" id="boundaries" checked />Closed
            regions</label
          >
          <label class="check"
            ><input type="checkbox" id="wall-traces" checked />Wall support
            traces</label
          >
          <label for="surface">Surface</label>
          <select id="surface"></select>
          <dl id="geometry-details"></dl>
          <ul id="geometry-flags"></ul>
        </div>
        <div class="section">
          <h2>Selected hypothesis</h2>
          <dl id="hypothesis"></dl>
          <h2 id="scores-title">Candidate scores</h2>
          <table id="scores-table">
            <thead>
              <tr>
                <th>Rank</th>
                <th>Scale / axes</th>
                <th>Score</th>
              </tr>
            </thead>
            <tbody id="scores"></tbody>
          </table>
        </div>
      </aside>
      <section id="viewport" aria-label="Interactive diagnostic point cloud">
        <div id="status" role="status">Loading captures...</div>
        <div class="legend">
          <span><b class="c0"></b>0</span><span><b class="c1"></b>1</span
          ><span><b class="c2"></b>2</span
          ><span><b class="path"></b>Trajectory</span>
        </div>
        <div id="stats"></div>
      </section>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
